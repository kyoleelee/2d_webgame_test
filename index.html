<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晨光冒险 · 第一关</title><style>*{box-sizing:border-box}body{margin:0;background:#101c29;color:#f4edd9;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.wrap{width:min(1100px,96vw)}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:24px}small{color:#93b5c8}canvas{width:100%;background:#88d3ec;border:4px solid #304759;border-radius:12px;image-rendering:pixelated;display:block}footer{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:10px}button{background:#f2ca68;color:#17293a;border:0;border-radius:8px;padding:12px 20px;font-weight:bold;cursor:pointer}.controls{display:flex;gap:8px;touch-action:none}p{color:#aac4d3;font-size:14px}button:focus-visible{outline:3px solid white}@media(max-width:600px){h1{font-size:18px}footer{flex-wrap:wrap}}</style><main class="wrap"><header><h1>晨光冒险 <small> / WORLD 01</small></h1><span id="hud" aria-live="polite"></span></header><canvas tabindex="0" id="game" width="960" height="480" aria-label="横版平台游戏，方向键移动，空格跳跃"></canvas><footer><div><button id="start">开始游戏</button> <button id="restart">重新开始</button> <button id="sound">音效：关</button></div><div class="controls"><button data-key="ArrowLeft" aria-label="向左">◀</button><button data-key="ArrowRight" aria-label="向右">▶</button><button data-key="ArrowDown" aria-label="钻水管">钻管 ↓</button><button data-key="Space">跳跃 ↑</button></div></footer><p>先点击“开始游戏”或游戏画面。← → / A D 移动 · 空格 / W / ↑ 跳跃 · 按住 Shift 加速 · ↓ / S 钻管 · R 重开。站在第三根水管顶部可进入地下宝库，地下出口返回最后一根水管。踩掉小怪、撞击金色砖块，跨越深坑到达旗帜！</p></main><script src="game.js"></script></html>
